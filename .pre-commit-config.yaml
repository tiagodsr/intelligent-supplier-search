# Local quality gates. Install once per clone with:  uv run pre-commit install
#
# - On `git commit`: fast checks. Formatters fix files in place; if a hook changes
#   something, the commit is stopped once, so re-stage (`git add -u`) and commit again.
#   No extra "fix formatting" commit ever reaches the history.
# - On `git push`: the test suite, so a red build never leaves the machine.
#
# CI (.github/workflows) runs the same tools, so a hook skipped with --no-verify is still caught.
default_install_hook_types: [pre-commit, pre-push]

repos:
  # GENERAL HYGIENE
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        name: Git - No direct commits to main
        args: [--branch, main]
      - id: check-added-large-files
        name: Git - Block large files
        args: [--maxkb=5000]
      - id: check-merge-conflict
        name: Git - Merge conflict markers
      - id: check-yaml
        name: YAML - Syntax
      - id: check-toml
        name: TOML - Syntax
      - id: detect-private-key
        name: Security - Private keys
      - id: end-of-file-fixer
        name: Text - Final newline
      - id: trailing-whitespace
        name: Text - Trailing whitespace
        args: [--markdown-linebreak-ext=md]

  # SECRETS
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: Security - Gitleaks

  # PYTHON (run through uv, so the Ruff and pytest versions are the ones pinned in uv.lock)
  - repo: local
    hooks:
      - id: ruff-check
        name: Python - Ruff Linter
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Python - Ruff Formatter
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
      - id: pytest
        name: Python - Tests (pre-push)
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # GITHUB ACTIONS (catches workflow mistakes before they are pushed)
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: GitHub Actions - Actionlint

  # TERRAFORM (only runs when .tf files are staged; needs terraform and tflint installed)
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.2
    hooks:
      - id: terraform_fmt
        name: Terraform - Formatter
      - id: terraform_validate
        name: Terraform - Validator
      - id: terraform_tflint
        name: Terraform - TFLint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl

  # DOCKER (only runs when a Dockerfile is staged; Hadolint installed from PyPI, no Docker needed)
  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
      - id: hadolint
        name: Docker - Hadolint
