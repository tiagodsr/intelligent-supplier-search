[project]
name = "supplier-search-assistant"
version = "0.1.0"
description = "Text-to-SQL assistant for procurement questions over a synthetic supplier database."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "assistant"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.format]
# The generator is mostly data tables with very long lines. Reformatting it would rewrite
# most of the file for no benefit, so its layout is left alone.
exclude = ["scripts/build_db.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The generator's logic is frozen: any change risks changing the seeded data.
"scripts/build_db.py" = ["E501", "RUF046"]
