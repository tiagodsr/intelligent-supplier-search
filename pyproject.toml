[project]
name = "supplier-search-assistant"
version = "0.1.0"
description = "Text-to-SQL assistant for procurement questions over a synthetic supplier database."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "assistant"

[tool.pytest.ini_options]
testpaths = ["tests"]
